<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#3182f6"><title>점수 입력 · 손으로 잇다</title><link rel="icon" href="assets/favicon.svg"><link rel="stylesheet" href="style.css"></head><body><header class="header"><a href="index.html" class="brand"><span class="brand-icon">✳</span>손으로 잇다<span class="brand-sub">수어 체험 부스</span></a><nav aria-label="메인 메뉴"><a href="index.html">수어 배우기</a><a href="leaderboard.html" aria-current="page">리더보드</a></nav></header><main class="admin-main"><span class="eyebrow">부스 운영</span><h1>멋진 도전을 기록해 주세요</h1><p class="admin-intro">게임이 끝나면 참가자의 닉네임과 점수를 입력해 주세요.</p><form id="score-form" class="form-card"><label class="field" for="nickname">참가자 닉네임<input id="nickname" name="nickname" placeholder="예: 손짓왕" maxlength="20" required autocomplete="off"><small>이름 대신 닉네임을 사용해 주세요. 최대 20자까지 입력할 수 있어요.</small></label><label class="field" for="score">게임 점수<input id="score" name="score" type="number" min="0" max="999999" step="1" placeholder="0" required inputmode="numeric"><small>0~999,999점 사이의 정수를 입력해 주세요.</small></label><button type="submit" class="primary-button">점수 등록하기 +</button><p class="status-message" id="form-status" role="status" aria-live="polite"></p></form><div class="info-note">기록은 <strong>이 브라우저에 저장</strong>돼요. 같은 브라우저에서 상단 메뉴에서 리더보드로 이동하면 등록한 점수를 볼 수 있어요. 브라우저 데이터를 지우기 전에는 기록을 내보내 주세요. 이 화면은 별도 로그인 없이 사용하는 부스 운영용 화면이에요.</div><section class="admin-list"><h2>등록한 기록 <span id="record-count">0</span></h2><div class="utility-actions"><button id="export-scores" class="secondary-button">기록 내보내기 ↓</button><label class="secondary-button import-label" for="import-file">기록 불러오기 ↑</label><input id="import-file" type="file" accept="application/json,.json" hidden><a class="secondary-button" href="leaderboard.html">리더보드 보기 →</a></div><p id="backup-status" class="status-message" role="status" aria-live="polite"></p><div id="records"></div></section></main><footer><span class="footer-brand">손으로 잇다</span><span>작은 손짓이 만드는, 더 가까운 우리.</span><a href="index.html">수어 배우러 가기 →</a></footer><script src="scores.js"></script><script src="admin.js"></script></body></html>
